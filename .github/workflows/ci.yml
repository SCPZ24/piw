name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm pack --dry-run
      - run: npm run smoke
      - run: npm run smoke:tarball

  node-compat:
    strategy:
      matrix:
        node: ["22.19.0", "lts/*", "node"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run validate
      - run: npm run smoke

  compat-pi:
    strategy:
      matrix:
        pi: ["0.83.0", "latest"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/pi-compat.mjs --pi-version ${{ matrix.pi }}
